<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="All status colors are green/gold shades — no separate hues" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-body)">
<div style="flex:1;background:var(--text-primary);display:flex;align-items:flex-end;padding:10px;color:var(--rk-paper-100);font-size:12px">text-primary · darkest green</div>
<div style="flex:1;background:var(--status-success);display:flex;align-items:flex-end;padding:10px;color:var(--rk-paper-100);font-size:12px">success · Secondary Green (green-800)</div>
<div style="flex:1;background:var(--status-warning);display:flex;align-items:flex-end;padding:10px;color:var(--text-on-gold);font-size:12px">warning · Brand Accent Gold (canonical)</div>
<div style="flex:1;background:var(--status-danger);display:flex;align-items:flex-end;padding:10px;color:var(--rk-paper-100);font-size:12px">danger · Highlight Red (canonical)</div>
<div style="flex:1;background:var(--status-info);display:flex;align-items:flex-end;padding:10px;color:var(--rk-paper-100);font-size:12px">info · green-700</div>
</div>
